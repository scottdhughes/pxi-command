name: Daily PXI Refresh

concurrency:
  # Operational isolation contract: this exact non-cancelling group is shared
  # with score-history-reconstruction.yml and production deploy-worker.yml.
  # Reconstruction reads current indicators, so these operations may not race.
  group: pxi-production-indicator-score-mutation
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      record_research_evidence:
        description: 'Reserve today canonical post-close evidence slot (run only after the US close)'
        required: false
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Acquire production mutation lease
        env:
          WRITE_API_KEY: ${{ secrets.WRITE_API_KEY }}
          WRITE_API_URL: ${{ secrets.WRITE_API_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${WRITE_API_URL:-}" || -z "${WRITE_API_KEY:-}" ]]; then
            echo "::error::Production WRITE_API_URL and WRITE_API_KEY are required"
            exit 1
          fi

          BASE_URL="${WRITE_API_URL%/api/write}"
          HOLDER_ID="github_daily_refresh:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          REQUEST_BODY="$(jq -cn \
            --arg holder_id "${HOLDER_ID}" \
            --arg holder_type 'github_daily_refresh' \
            --argjson lease_minutes 60 \
            '{holder_id: $holder_id, holder_type: $holder_type, lease_minutes: $lease_minutes}')"
          if ! HTTP_CODE="$(curl -sS \
            --connect-timeout 10 \
            --max-time 20 \
            -o /tmp/pxi-daily-refresh-lease-acquire.json \
            -w '%{http_code}' \
            -X POST "${BASE_URL}/api/admin/refresh/lease/acquire" \
            -H "Authorization: Bearer ${WRITE_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "${REQUEST_BODY}")"; then
            echo "::error::Production mutation lease request failed"
            exit 1
          fi
          if [[ "${HTTP_CODE}" != "200" ]] || ! jq -e \
            '.status == "claimed" and
             .lock_name == "indicator_score_mutation" and
             .holder_type == "github_daily_refresh"' \
            /tmp/pxi-daily-refresh-lease-acquire.json >/dev/null; then
            echo "::error::Production mutation lease was not acquired (HTTP ${HTTP_CODE})"
            jq -c . /tmp/pxi-daily-refresh-lease-acquire.json 2>/dev/null || true
            exit 1
          fi
          : > /tmp/pxi-daily-refresh-lease-acquired

      - name: Fetch and write to D1 via Worker API
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WRITE_API_KEY: ${{ secrets.WRITE_API_KEY }}
          WRITE_API_URL: ${{ secrets.WRITE_API_URL }}
          CRON_WRITE_BATCH_SIZE: 2500
          SLA_SUMMARY_PATH: /tmp/pxi-sla-summary.json
          STALE_TOP_OFFENDERS_PATH: /tmp/pxi-stale-top-offenders.json
          MARKET_SUMMARY_PATH: /tmp/pxi-market-summary.json
          RESEARCH_CAPTURE_SUMMARY_PATH: /tmp/pxi-research-capture-summary.json
          RESEARCH_EVIDENCE_CAPTURE: ${{ github.event.schedule == '0 22 * * 1-5' || inputs.record_research_evidence == true }}
        run: npm run cron:daily

      - name: Release production mutation lease
        if: ${{ always() }}
        env:
          WRITE_API_KEY: ${{ secrets.WRITE_API_KEY }}
          WRITE_API_URL: ${{ secrets.WRITE_API_URL }}
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/pxi-daily-refresh-lease-acquired ]]; then
            exit 0
          fi

          BASE_URL="${WRITE_API_URL%/api/write}"
          HOLDER_ID="github_daily_refresh:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          REQUEST_BODY="$(jq -cn --arg holder_id "${HOLDER_ID}" '{holder_id: $holder_id}')"
          if ! HTTP_CODE="$(curl -sS \
            --connect-timeout 10 \
            --max-time 20 \
            -o /tmp/pxi-daily-refresh-lease-release.json \
            -w '%{http_code}' \
            -X POST "${BASE_URL}/api/admin/refresh/lease/release" \
            -H "Authorization: Bearer ${WRITE_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "${REQUEST_BODY}")"; then
            echo "::error::Production mutation lease release request failed"
            exit 1
          fi
          if [[ "${HTTP_CODE}" != "200" ]] || ! jq -e '.released == true' \
            /tmp/pxi-daily-refresh-lease-release.json >/dev/null; then
            echo "::error::Production mutation lease was not released (HTTP ${HTTP_CODE})"
            jq -c . /tmp/pxi-daily-refresh-lease-release.json 2>/dev/null || true
            exit 1
          fi
          rm /tmp/pxi-daily-refresh-lease-acquired

      - name: Verify immutable research snapshot capture
        if: ${{ github.event.schedule == '0 22 * * 1-5' || inputs.record_research_evidence == true }}
        env:
          WRITE_API_KEY: ${{ secrets.WRITE_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const path = '/tmp/pxi-research-capture-summary.json';
          if (!fs.existsSync(path)) throw new Error('Research capture summary was not produced');
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/New_York',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          }).formatToParts(new Date());
          const part = (type) => parts.find((entry) => entry.type === type)?.value;
          const expectedDecisionDate = `${part('year')}-${part('month')}-${part('day')}`;
          if (summary.requested !== true || summary.decision_date !== expectedDecisionDate) {
            throw new Error(`Capture summary does not match requested New York date ${expectedDecisionDate}`);
          }
          if (summary.trading_day_expected === false) {
            if (summary.evidence_status !== 'skipped_canonical_capture') {
              throw new Error(`Unexpected evidence status on a known market closure: ${summary.evidence_status}`);
            }
            fs.writeFileSync('/tmp/pxi-known-market-closure', '1');
            console.log(`Canonical capture correctly skipped for known US market closure ${expectedDecisionDate}`);
          } else if (!['inserted', 'existing'].includes(summary.evidence_status)) {
            throw new Error(`Canonical capture failed on expected trading day: ${summary.evidence_status}`);
          }
          NODE
          if [[ -f /tmp/pxi-known-market-closure ]]; then
            exit 0
          fi
          python3 research/export_d1_snapshot.py --out /tmp/pxi-d1-research-snapshot.json
          node <<'NODE'
          const fs = require('node:fs');

          const payload = JSON.parse(fs.readFileSync('/tmp/pxi-d1-research-snapshot.json', 'utf8'));
          const now = new Date();
          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/New_York',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          }).formatToParts(now);
          const part = (type) => parts.find((entry) => entry.type === type)?.value;
          const expectedDecisionDate = `${part('year')}-${part('month')}-${part('day')}`;
          if (payload.point_in_time_guarantee !== true) {
            throw new Error('Research export did not assert point-in-time safety');
          }
          if (payload.canonical_slot !== 'daily_close_22z') {
            throw new Error('Research export is not bound to the canonical daily close slot');
          }
          if (!Array.isArray(payload.rows) || payload.rows.length < 1) {
            throw new Error('Research export contains no immutable decision snapshots');
          }
          const latest = payload.rows[payload.rows.length - 1];
          const featureNames = Object.keys(latest.features || {});
          const observationNames = Object.keys(latest.feature_observation_dates || {});
          const sourceNames = Object.keys(latest.feature_sources || {});
          if (latest.immutable_snapshot !== true || !latest.snapshot_id) {
            throw new Error('Latest research row is not marked immutable');
          }
          if (latest.canonical_slot !== 'daily_close_22z') {
            throw new Error('Latest research row is not the canonical daily close vintage');
          }
          if (latest.decision_date !== expectedDecisionDate) {
            throw new Error(`Canonical evidence stream did not capture ${expectedDecisionDate}; latest is ${latest.decision_date}`);
          }
          if (featureNames.length < 1 || featureNames.length !== observationNames.length || featureNames.length !== sourceNames.length) {
            throw new Error('Latest research row has incomplete feature provenance');
          }
          if (!featureNames.every((name) =>
            Object.hasOwn(latest.feature_observation_dates, name) &&
            Object.hasOwn(latest.feature_sources, name)
          )) {
            throw new Error('Latest research row provenance keys do not match its feature keys');
          }
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `\n### Immutable research capture\n\n- rows: ${payload.rows.length}\n- latest decision: ${latest.decision_date}\n- latest features: ${featureNames.length}\n- storage: ${payload.storage_contract}\n`,
          );
          NODE

      - name: Append SLA summary
        if: always()
        run: |
          if [[ -f /tmp/pxi-sla-summary.json ]]; then
            {
              echo "### PXI SLA Summary"
              echo ""
              echo "| Indicator | Latest Date | Days Old | Threshold | Class | Critical | Status |"
              echo "|---|---|---:|---:|---|---|---|"
              jq -r '.checks[] | "| \(.indicator_id) | \(.latest_date // "missing") | \((.days_old // "n/a") | tostring) | \(.max_age_days) | \(.sla_class) | \(.critical) | \(.status) |"' /tmp/pxi-sla-summary.json
              if jq -e '.top_offenders | length > 0' /tmp/pxi-sla-summary.json >/dev/null 2>&1; then
                echo ""
                echo "#### Top stale offenders"
                echo ""
                echo "| Indicator | Status | Days Old | Chronic | Escalation | Owner | Retry Attempts |"
                echo "|---|---|---:|---|---|---|---:|"
                jq -r '.top_offenders[] | "| \(.indicator_id) | \(.status) | \((.days_old // "n/a") | tostring) | \(.chronic) | \(.policy.escalation) | \(.policy.owner) | \(.policy.retry_attempts) |"' /tmp/pxi-sla-summary.json
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### PXI SLA Summary"
              echo ""
              echo "No SLA summary file produced by cron run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Append market products summary
        if: always()
        run: |
          if [[ -f /tmp/pxi-market-summary.json ]]; then
            {
              echo ""
              echo "### PXI Market Products Summary"
              echo ""
              echo "| Publication status | Reason | Brief generated | Opportunities generated | Calibrations generated | Alerts generated | Coherence suppressed | Quality filtered | Data-quality suppressed | Over-suppressed | Critical stale | Cross-horizon state | Impact snapshots | Market 7d hit (n) | Market 30d hit (n) | CTA action rate | Actionable sessions | Governance mode | Enforce ready | Enforce breaches | Observe breaches | Edge gate | Decision grade | Go-live ready | As of |"
              echo "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---:|---|---|---:|---:|---|---|---:|---:|---|---|---|---|"
              jq -r '"| \(.result.publication_status // (if .result.blocked == true then "blocked" elif .result.skipped == true then "skipped" else "published" end)) | \(.result.reason // "n/a") | \(.result.brief_generated // 0) | \(.result.opportunities_generated // 0) | \(.result.calibrations_generated // 0) | \(.result.alerts_generated // 0) | \(.result.coherence_suppressed_count // 0) | \(.result.quality_filtered_count // 0) | \(.result.suppressed_data_quality_count // 0) | \(.result.over_suppressed_count // 0) | \(.result.critical_stale_count // 0) | \(.result.cross_horizon_state // "n/a") | \(.result.decision_impact_snapshots_generated // 0) | \((.result.decision_impact.market_7d_hit_rate // "n/a") | tostring) n=\((.result.decision_impact.market_7d_sample_size // "n/a") | tostring) | \((.result.decision_impact.market_30d_hit_rate // "n/a") | tostring) n=\((.result.decision_impact.market_30d_sample_size // "n/a") | tostring) | \((.result.decision_impact.cta_action_rate_pct // "n/a") | tostring) | \((.result.decision_impact.actionable_sessions // "n/a") | tostring) | \((.result.decision_impact.governance_mode // "n/a") | tostring) | \((.result.decision_impact.enforce_ready // "n/a") | tostring) | \((.result.decision_impact.enforce_breach_count // "n/a") | tostring) | \((.result.decision_impact.observe_breach_count // "n/a") | tostring) | \((.result.edge_diagnostics.promotion_gate.pass // "n/a") | tostring) | \((.result.decision_grade_snapshot.grade // "n/a") | tostring) | \((.result.decision_grade_snapshot.go_live_ready // "n/a") | tostring) | \(.result.as_of // "n/a") |"' /tmp/pxi-market-summary.json
              if jq -e '.result.governance_breaches != null and (.result.governance_breaches | length > 0)' /tmp/pxi-market-summary.json >/dev/null 2>&1; then
                echo ""
                echo "| Governance breaches |"
                echo "|---|"
                jq -r '"| " + ((.result.governance_breaches // []) | join(", ")) + " |"' /tmp/pxi-market-summary.json
              fi
              if jq -e '.result.decision_impact.observe_breaches != null and (.result.decision_impact.observe_breaches | length > 0)' /tmp/pxi-market-summary.json >/dev/null 2>&1; then
                echo ""
                echo "| Decision-impact observe breaches |"
                echo "|---|"
                jq -r '"| " + ((.result.decision_impact.observe_breaches // []) | join(", ")) + " |"' /tmp/pxi-market-summary.json
              fi
              if jq -e '.result.decision_impact.enforce_breaches != null and (.result.decision_impact.enforce_breaches | length > 0)' /tmp/pxi-market-summary.json >/dev/null 2>&1; then
                echo ""
                echo "| Decision-impact enforce breaches |"
                echo "|---|"
                jq -r '"| " + ((.result.decision_impact.enforce_breaches // []) | join(", ")) + " |"' /tmp/pxi-market-summary.json
              fi
              echo ""
              echo "| Calibration diagnostic bands |"
              echo "|---|"
              jq -r '"| edge=\(.result.calibration_diagnostics.edge_quality // "n/a"), conviction_7d=\(.result.calibration_diagnostics.conviction_7d // "n/a"), conviction_30d=\(.result.calibration_diagnostics.conviction_30d // "n/a") |"' /tmp/pxi-market-summary.json
              if jq -e '.result.decision_grade_snapshot != null' /tmp/pxi-market-summary.json >/dev/null 2>&1; then
                echo ""
                echo "| Decision-grade snapshot (from refresh run) |"
                echo "|---|"
                jq -r '"| score=\((.result.decision_grade_snapshot.score // "n/a")|tostring), grade=\(.result.decision_grade_snapshot.grade // "n/a"), go_live_ready=\((.result.decision_grade_snapshot.go_live_ready // "n/a")|tostring), blockers=\(((.result.decision_grade_snapshot.go_live_blockers // []) | length)|tostring), over_suppression_rate=\((.result.decision_grade_snapshot.opportunity_hygiene.over_suppression_rate_pct // "n/a")|tostring), cross_horizon_conflict_rate=\((.result.decision_grade_snapshot.opportunity_hygiene.cross_horizon_conflict_rate_pct // "n/a")|tostring), conflict_persistence_days=\((.result.decision_grade_snapshot.opportunity_hygiene.conflict_persistence_days // "n/a")|tostring) |"' /tmp/pxi-market-summary.json
              fi
              if jq -e '.result.edge_diagnostics != null' /tmp/pxi-market-summary.json >/dev/null 2>&1; then
                echo ""
                echo "| Edge uplift diagnostics |"
                echo "|---|"
                jq -r '
                  (.result.edge_diagnostics.windows // [])
                  | map("h=\(.horizon), n=\(.sample_size), uplift=\((.uplift_vs_baseline // "n/a")|tostring), ci_low=\((.uplift_ci95_low // "n/a")|tostring), ci_high=\((.uplift_ci95_high // "n/a")|tostring), leakage_pass=\(.leakage_sentinel.pass)")
                  | "| " + (if length > 0 then join(" ; ") else "n/a" end) + " |"
                ' /tmp/pxi-market-summary.json
                jq -r '"| gate_reasons=\((.result.edge_diagnostics.promotion_gate.reasons // []) | join(",")) |"' /tmp/pxi-market-summary.json
              fi
              decision_code="$(curl -sS -o /tmp/pxi-decision-grade.json -w '%{http_code}' --max-time 20 "https://api.pxicommand.com/api/ops/decision-grade?window=30")"
              echo ""
              echo "| Decision-grade endpoint (30d) |"
              echo "|---|"
              if [[ "${decision_code}" == "200" ]]; then
                jq -r '"| score=\(.score), grade=\(.grade), go_live_ready=\(.go_live_ready), blockers=\(((.go_live_blockers // []) | length)|tostring), freshness=\(.components.freshness.status), consistency=\(.components.consistency.status), calibration=\(.components.calibration.status), edge=\(.components.edge.status), opp_hygiene=\(.components.opportunity_hygiene.status), utility=\(.components.utility.status), over_suppression_rate=\(.components.opportunity_hygiene.over_suppression_rate_pct), cross_horizon_conflict_rate=\(.components.opportunity_hygiene.cross_horizon_conflict_rate_pct), conflict_persistence_days=\(.components.opportunity_hygiene.conflict_persistence_days) |"' /tmp/pxi-decision-grade.json
              else
                echo "| unavailable (status ${decision_code}) |"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "### PXI Market Products Summary"
              echo ""
              echo "No market products summary file produced by cron run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log result
        if: always()
        run: echo "Daily refresh completed at $(date)"
